<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生成績查詢系統 - 首頁</title>
    <style>
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --hover-color: #3a759c;
            --danger-color: #e71d36;
        }
        body {
            background-color: var(--bg-color);
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .menu-btn {
            display: block;
            background: #f8f9fa;
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            text-decoration: none;
            color: var(--primary-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .menu-btn h3 {
            margin: 0 0 5px 0;
            font-size: 20px;
        }
        .menu-btn p {
            margin: 0;
            font-size: 14px;
            color: #777;
            transition: all 0.3s ease;
        }
        .menu-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(43, 88, 118, 0.2);
        }
        .menu-btn:hover p {
            color: #e9f5f9;
        }
        #error-message {
            color: var(--danger-color);
            background: #ffebee;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            margin-bottom: 20px;
        }
        #menu-section {
            display: none; /* 預設隱藏，確認有 token 才顯示 */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>學生成績查詢入口</h2>
        <p class="subtitle">請選擇您要查詢的成績類別</p>
        
        <!-- 錯誤提示區塊 -->
        <div id="error-message">未偵測到專屬識別碼，請使用老師提供的專屬連結進入。</div>

        <!-- 按鈕選項區塊 -->
        <div id="menu-section">
            <!-- 假設段考頁面叫做 index.html -->
            <a id="link-exam" class="menu-btn" href="#">
                <h3>📅 歷次段考成績</h3>
                <p>查詢段考排名與各科成績分析圖表</p>
            </a>

            <!-- 假設模擬考頁面叫做 mock.html -->
            <a id="link-mock" class="menu-btn" href="#">
                <h3>🎯 複習模考成績</h3>
                <p>查詢會考七級分、積分轉換與落點分析</p>
            </a>
        </div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        // 1. 抓取網址列中的 token 參數
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const errorDiv = document.getElementById('error-message');
        const menuDiv = document.getElementById('menu-section');

        // 2. 判斷是否有 token
        if (!token) {
            // 沒有 token，顯示錯誤訊息，隱藏按鈕
            errorDiv.style.display = 'block';
            menuDiv.style.display = 'none';
        } else {
            // 有 token，顯示按鈕，並將 token 動態加入到按鈕的連結中
            errorDiv.style.display = 'none';
            menuDiv.style.display = 'block';

            // ⚠️ 這裡設定檔案名稱，請依照你在 GitHub 上的實際檔名修改
            document.getElementById('link-exam').href = `index.html?token=${token}`;
            document.getElementById('link-mock').href = `mock.html?token=${token}`; // 這是你接下來要處理的新頁面
        }
    });
</script>

</body>
</html>
