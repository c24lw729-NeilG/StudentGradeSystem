<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師管理後台 - 全班成績分析系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --highlight: #f39c12;
            --highlight-alt: #e67e22;
            --danger-color: #e71d36;
            --success-color: #2ec4b6;
            --purple-color: #9b59b6;
        }
        body {
            background-color: var(--bg-color);
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .card {
            background: var(--card-bg); padding: 25px 30px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        /* 登入卡片樣式 */
        #login-container {
            max-width: 420px;
            margin: 80px auto;
            text-align: center;
        }
        .login-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }
        .login-input:focus {
            border-color: var(--primary-color);
        }
        .login-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            background: #1e3f55;
        }
        #login-error {
            color: var(--danger-color);
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }

        /* 後台主頁樣式 */
        .header-title {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #edf2f7; padding-bottom: 15px; margin-bottom: 20px;
        }
        h2 { color: var(--primary-color); margin: 0; }
        .logout-btn {
            background: transparent;
            color: #666;
            border: 1px solid #ccc;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background: #fee2e2;
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .filter-group {
            display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 20px;
        }
        .filter-item { display: flex; align-items: center; gap: 8px; }
        select {
            padding: 9px 14px; font-size: 15px; border-radius: 6px;
            border: 2px solid var(--primary-color); outline: none; background: white; cursor: pointer;
        }

        /* 表格樣式 */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; font-size: 15px; }
        th {
            background-color: #f8fafc; color: var(--primary-color);
            font-weight: 700; user-select: none;
        }
        tbody tr { cursor: pointer; transition: background 0.15s ease-in-out; }
        tbody tr:hover { background-color: #edf5fa; }
        .badge {
            padding: 3px 8px; border-radius: 12px; font-size: 13px; font-weight: bold; color: #fff;
        }
        .badge-rank { background: var(--highlight); }
        .badge-wrank { background: var(--highlight-alt); }
        .badge-school { background: var(--purple-color); }
        .badge-point { background: #d35400; font-size: 14px; }
        .score-fail { color: var(--danger-color); font-weight: bold; }

        /* Modal 彈出視窗 */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px); align-items: center; justify-content: center;
        }
        .modal-content {
            background: #fff; border-radius: 12px; width: 90%; max-width: 750px;
            max-height: 90vh; overflow-y: auto; padding: 25px 30px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute; right: 20px; top: 15px; font-size: 26px;
            cursor: pointer; color: #aaa; transition: 0.2s;
        }
        .modal-close:hover { color: #333; }
        .student-summary-strip {
            display: flex; justify-content: space-around; background: #e9f5f9;
            padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; margin: 15px 0;
            flex-wrap: wrap; gap: 10px;
        }
        .chart-box { height: 320px; position: relative; margin-top: 20px; }
        #loading { text-align: center; font-size: 17px; color: var(--primary-color); padding: 40px; display: none; }
        #error-message { color: var(--danger-color); text-align: center; font-weight: bold; padding: 20px; display: none; }
    </style>
</head>
<body>

<!-- 1. 老師密碼登入卡片 -->
<div id="login-container" class="card">
    <h2 style="margin-bottom: 10px;">🔐 教師管理後台</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 25px;">請輸入教師管理密碼以存取全班成績</p>
    
    <input type="password" id="admin-password" class="login-input" placeholder="請輸入管理密碼..." onkeydown="if(event.key==='Enter') handleLogin()">
    <button class="login-btn" id="login-submit-btn" onclick="handleLogin()">登入後台</button>
    <div id="login-error">密碼錯誤或無法連線，請重試！</div>
</div>

<!-- 2. 主控台管理區塊 (預設隱藏，登入成功後顯示) -->
<div class="container" id="admin-main-container" style="display: none;">
    <div class="card">
        <div class="header-title">
            <h2>🎓 教師班級成績後台</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 14px; color: #666;">點選名冊即可調閱個人詳細考卷</span>
                <button class="logout-btn" onclick="handleLogout()">登出</button>
            </div>
        </div>

        <!-- 條件篩選區 (分類與考試) -->
        <div class="filter-group">
            <div class="filter-item">
                <label for="category-select" style="font-weight:bold;">考試類別：</label>
                <select id="category-select" onchange="handleCategoryChange()">
                    <option value="exam">📅 歷次平時及段考</option>
                    <option value="saturday" selected>📝 週六複習卷</option>
                    <option value="mock">🎯 複習模考 (會考7級分)</option>
                </select>
            </div>

            <div class="filter-item">
                <label for="exam-select" style="font-weight:bold;">選擇場次：</label>
                <select id="exam-select" onchange="renderStudentTable()"></select>
            </div>
        </div>

        <div id="loading">載入資料中，請稍候...</div>
        <div id="error-message"></div>

        <!-- 全班成績列表 -->
        <div id="content-section" style="display:none;">
            <div class="table-responsive">
                <table id="roster-table">
                    <thead id="roster-thead"></thead>
                    <tbody id="roster-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 3. 學生個人詳細資訊彈出視窗 (Modal) -->
<div id="student-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h3 id="modal-student-title" style="margin-top: 0; color: var(--primary-color);"></h3>
        
        <div id="modal-stat-box" class="student-summary-strip"></div>

        <!-- 科目得分列表 -->
        <table id="modal-detail-table">
            <thead id="modal-detail-thead"></thead>
            <tbody id="modal-detail-tbody"></tbody>
        </table>

        <!-- 個人與班級比較圖表 -->
        <div class="chart-box">
            <canvas id="detailChart"></canvas>
        </div>
    </div>
</div>

<script>
    // ⚠️ 請確認此處對應的 GAS API 網址
    const API_CONFIG = {
        exam: "https://script.google.com/macros/s/AKfycbyq6XLva5EsEGBLMATn8ZIKpfPqBReEG80k-TK9z5FxY0GpLdhT3aHkTzpVkSk-U9jq3A/exec",
        saturday: "https://script.google.com/macros/s/AKfycbwLfaKyrz0njFApo-7tacHe-8Nsnnu1uQs2q_Wt75lFXzlCq6ZeLsF6AXAwEPoA8pW4TQ/exec",
        mock: "https://script.google.com/macros/s/AKfycbzeqUoCEmPAeuSvdkPNPkKAIi4RFQXsvOyLSpx-gBDGB85hA-q2n6Q803eAqA1-a5l3/exec"
    };

    let rawClassData = null; 
    let currentCategory = 'saturday';
    let currentExamList = [];
    let modalChartInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
        // 檢查 Session 中是否已保留密碼，或者網址列有帶入 adminToken
        const savedToken = sessionStorage.getItem('adminToken');
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('adminToken') || urlParams.get('token');

        const activeToken = savedToken || urlToken;

        if (activeToken) {
            sessionStorage.setItem('adminToken', activeToken);
            verifyAndLoadData(activeToken);
        } else {
            showLoginForm();
        }
    });

    function showLoginForm() {
        document.getElementById('login-container').style.display = 'block';
        document.getElementById('admin-main-container').style.display = 'none';
        document.getElementById('admin-password').focus();
    }

    function handleLogin() {
        const inputPwd = document.getElementById('admin-password').value.trim();
        const btn = document.getElementById('login-submit-btn');
        const errDiv = document.getElementById('login-error');

        if (!inputPwd) {
            errDiv.style.display = 'block';
            errDiv.innerText = "請輸入密碼！";
            return;
        }

        btn.innerText = "驗證中...";
        btn.disabled = true;
        errDiv.style.display = 'none';

        // 嘗試以目前選定的分類去後端驗證密碼
        verifyAndLoadData(inputPwd, () => {
            // 驗證失敗 callback
            btn.innerText = "登入後台";
            btn.disabled = false;
            errDiv.style.display = 'block';
            errDiv.innerText = "管理密碼錯誤，請重新確認！";
            document.getElementById('admin-password').value = '';
            sessionStorage.removeItem('adminToken');
        });
    }

    function handleLogout() {
        sessionStorage.removeItem('adminToken');
        document.getElementById('admin-password').value = '';
        showLoginForm();
    }

    function handleCategoryChange() {
        currentCategory = document.getElementById('category-select').value;
        const token = sessionStorage.getItem('adminToken');
        if (token) {
            loadCategoryData(currentCategory, token);
        }
    }

    // 驗證並載入資料
    function verifyAndLoadData(token, onFail) {
        const apiUrl = API_CONFIG[currentCategory];
        fetch(`${apiUrl}?adminToken=${encodeURIComponent(token)}&mode=allStudents`, {
            method: 'GET',
            redirect: 'follow'
        })
        .then(async res => {
            if (!res.ok) throw new Error("伺服器回應異常");
            return res.json();
        })
        .then(data => {
            if (data.error) {
                if (onFail) onFail();
                else {
                    alert(data.error);
                    handleLogout();
                }
            } else {
                // 驗證成功
                sessionStorage.setItem('adminToken', token);
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('admin-main-container').style.display = 'block';
                
                rawClassData = data;
                initExamSelect();
            }
        })
        .catch(err => {
            if (onFail) onFail();
            else {
                alert("無法連線至雲端系統，請稍後再試。");
                handleLogout();
            }
        });
    }

    // 取得指定分類資料
    function loadCategoryData(category, token) {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('error-message').style.display = 'none';
        document.getElementById('content-section').style.display = 'none';

        const apiUrl = API_CONFIG[category];
        fetch(`${apiUrl}?adminToken=${encodeURIComponent(token)}&mode=allStudents`, {
            method: 'GET',
            redirect: 'follow'
        })
        .then(async res => {
            if (!res.ok) throw new Error("伺服器回應異常");
            return res.json();
        })
        .then(data => {
            if (data.error) {
                showError(data.error);
            } else {
                rawClassData = data;
                initExamSelect();
            }
        })
        .catch(err => {
            showError("讀取失敗，請檢查網路連線或 GAS 權限。");
        });
    }

    function showError(msg) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content-section').style.display = 'none';
        const errDiv = document.getElementById('error-message');
        errDiv.style.display = 'block';
        errDiv.innerText = msg;
    }

    function initExamSelect() {
        const examSelect = document.getElementById('exam-select');
        examSelect.innerHTML = '';
        
        currentExamList = rawClassData.examList || [];
        // 最新考試排最前
        [...currentExamList].reverse().forEach((examName, idx) => {
            const opt = document.createElement('option');
            opt.value = currentExamList.length - 1 - idx;
            opt.textContent = examName;
            examSelect.appendChild(opt);
        });

        renderStudentTable();
    }

    // 渲染主名冊表格 (按學生座號升冪排序)
    function renderStudentTable() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content-section').style.display = 'block';

        const examIdx = document.getElementById('exam-select').value;
        const thead = document.getElementById('roster-thead');
        const tbody = document.getElementById('roster-tbody');
        tbody.innerHTML = '';

        let students = (rawClassData.students || []).slice().sort((a, b) => Number(a.seat) - Number(b.seat));

        if (currentCategory === 'mock') {
            thead.innerHTML = `
                <tr>
                    <th>座號</th>
                    <th>姓名</th>
                    <th>總積分</th>
                    <th>寫作</th>
                    <th>班排</th>
                    <th>校排</th>
                    <th>操作</th>
                </tr>
            `;

            students.forEach(stu => {
                const exam = stu.mocks ? stu.mocks[examIdx] : null;
                const tr = document.createElement('tr');
                tr.onclick = () => showStudentModal(stu, examIdx);
                
                tr.innerHTML = `
                    <td style="font-weight:bold;">${stu.seat}</td>
                    <td>${stu.name}</td>
                    <td><span class="badge badge-point">${exam?.totalPoint ?? '-'} 點</span></td>
                    <td>${exam?.writing ? exam.writing + ' 級' : '-'}</td>
                    <td><span class="badge badge-rank">${exam?.classRank ? '第 ' + exam.classRank + ' 名' : '-'}</span></td>
                    <td><span class="badge badge-school">${exam?.schoolRank ? '第 ' + exam.schoolRank + ' 名' : '-'}</span></td>
                    <td style="color:var(--primary-color); font-weight:bold;">檢視 ❯</td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            thead.innerHTML = `
                <tr>
                    <th>座號</th>
                    <th>姓名</th>
                    <th>平均</th>
                    <th>加權平均</th>
                    <th>班排</th>
                    <th>加權排名</th>
                    <th>校排</th>
                    <th>操作</th>
                </tr>
            `;

            students.forEach(stu => {
                const exam = stu.exams ? stu.exams[examIdx] : null;
                const tr = document.createElement('tr');
                tr.onclick = () => showStudentModal(stu, examIdx);

                tr.innerHTML = `
                    <td style="font-weight:bold;">${stu.seat}</td>
                    <td>${stu.name}</td>
                    <td style="font-weight:bold; color:var(--primary-color);">${exam?.average ? exam.average.toFixed(1) : '-'}</td>
                    <td>${exam?.weightedAverage ? exam.weightedAverage.toFixed(1) : '-'}</td>
                    <td><span class="badge badge-rank">${exam?.rank ? '第 ' + exam.rank + ' 名' : '-'}</span></td>
                    <td><span class="badge badge-wrank">${exam?.weightedRank ? '第 ' + exam.weightedRank + ' 名' : '-'}</span></td>
                    <td><span class="badge badge-school">${exam?.schoolRank ? '第 ' + exam.schoolRank + ' 名' : '-'}</span></td>
                    <td style="color:var(--primary-color); font-weight:bold;">檢視 ❯</td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    // 開啟學生詳細 Modal
    function showStudentModal(student, examIdx) {
        document.getElementById('modal-student-title').innerText = `座號 ${student.seat} 號 - ${student.name} 的詳細成績`;
        const statBox = document.getElementById('modal-stat-box');
        const thead = document.getElementById('modal-detail-thead');
        const tbody = document.getElementById('modal-detail-tbody');
        tbody.innerHTML = '';

        if (currentCategory === 'mock') {
            const exam = student.mocks[examIdx];
            statBox.innerHTML = `
                <div>總積分：<span style="color:#d35400;">${exam?.totalPoint ?? '-'} 點</span></div>
                <div>寫作級分：<span>${exam?.writing ?? '-'} 級</span></div>
                <div>班排名：<span>第 ${exam?.classRank ?? '-'} 名</span></div>
                <div>校排名：<span>第 ${exam?.schoolRank ?? '-'} 名</span></div>
            `;
            thead.innerHTML = `
                <tr><th>科目</th><th>得分</th><th>會考標示</th></tr>
            `;

            const subjects = [
                { name: "國文", pt: exam.chnPoint, sc: exam.chnScore },
                { name: "英文", pt: exam.engPoint, sc: exam.engScore },
                { name: "數學", pt: exam.mathPoint, sc: exam.mathScore },
                { name: "社會", pt: exam.socPoint, sc: exam.socScore },
                { name: "自然", pt: exam.sciPoint, sc: exam.sciScore }
            ];

            let radarScores = [];
            subjects.forEach(sub => {
                radarScores.push(Number(sub.pt) || 0);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold;">${sub.name}</td>
                    <td>${sub.sc ?? '-'}</td>
                    <td style="font-weight:bold; color:#2980b9;">${sub.pt} 點</td>
                `;
                tbody.appendChild(tr);
            });

            renderModalRadarChart(subjects.map(s => s.name), radarScores);

        } else {
            const exam = student.exams[examIdx];
            statBox.innerHTML = `
                <div>平均：<span>${exam?.average ? exam.average.toFixed(1) : '-'}</span></div>
                <div>加權平均：<span>${exam?.weightedAverage ? exam.weightedAverage.toFixed(1) : '-'}</span></div>
                <div>排名：<span>第 ${exam?.rank ?? '-'} 名</span></div>
                <div>加權排名：<span>第 ${exam?.weightedRank ?? '-'} 名</span></div>
            `;
            thead.innerHTML = `
                <tr><th>科目</th><th>權重</th><th>個人分數</th><th>班級平均</th></tr>
            `;

            const subjects = Object.keys(exam.scores || {});
            let personalScores = [];
            let classAvgScores = [];

            subjects.forEach(sub => {
                const score = exam.scores[sub];
                const classAvg = exam.classAverages ? exam.classAverages[sub] : 0;
                personalScores.push(score);
                classAvgScores.push(classAvg ? classAvg.toFixed(1) : 0);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold;">${sub}</td>
                    <td>x ${exam.weights?.[sub] || 1}</td>
                    <td class="${score < 60 ? 'score-fail' : ''}">${score}</td>
                    <td style="color:#666;">${classAvg ? classAvg.toFixed(1) : '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            renderModalLineChart(subjects, personalScores, classAvgScores);
        }

        document.getElementById('student-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('student-modal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('student-modal');
        if (event.target === modal) closeModal();
    };

    function renderModalLineChart(labels, personal, classAvg) {
        if (modalChartInstance) modalChartInstance.destroy();
        const ctx = document.getElementById('detailChart').getContext('2d');
        modalChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '該生得分', data: personal,
                        borderColor: '#4e4376', backgroundColor: 'rgba(78, 67, 118, 0.15)',
                        borderWidth: 3, fill: true
                    },
                    {
                        label: '全班平均', data: classAvg,
                        borderColor: '#2ec4b6', borderDash: [5, 5], borderWidth: 2
                    }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function renderModalRadarChart(labels, radarScores) {
        if (modalChartInstance) modalChartInstance.destroy();
        const ctx = document.getElementById('detailChart').getContext('2d');
        modalChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: '各科積分(滿分7分)',
                    data: radarScores,
                    backgroundColor: 'rgba(230, 126, 34, 0.2)',
                    borderColor: 'rgba(230, 126, 34, 1)',
                    pointBackgroundColor: 'rgba(230, 126, 34, 1)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { r: { min: 0, max: 7, ticks: { stepSize: 1 } } }
            }
        });
    }
</script>
</body>
</html>
